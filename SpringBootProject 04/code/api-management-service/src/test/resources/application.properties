spring.application.name=api-management-service

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:h2:mem:gatekeeper_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
